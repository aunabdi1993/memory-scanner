[mypy]
python_version = 3.11
files = .
exclude = (^venv/|^uploads/|^processed/|^alembic/versions/|^scripts/)

# Catch bodies of untyped functions too; cheap and useful.
check_untyped_defs = True

# Reasonable noise floor. Tighten per-module below.
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True

# Third-party libs without stubs we don't need mypy to scrutinise.
[mypy-piexif.*]
ignore_missing_imports = True

[mypy-pytesseract.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-pythonjsonlogger.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

# Tests stay loose — pytest fixtures and dynamic imports drown the signal.
[mypy-tests.*]
check_untyped_defs = False
disallow_untyped_defs = False
